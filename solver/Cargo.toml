[package]
name = "fourfall-solver"
version = "0.1.0"
edition = "2021"
description = "Perfect solver for four in a row on a 7 x 6 board, built for WebAssembly"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "c4"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = false
